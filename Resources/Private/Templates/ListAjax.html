{namespace be=TYPO3\CMS\Backend\ViewHelpers}

<f:for each="{pages}" as="page">

    <f:render section="entry" arguments="{page:page,indent:'ps-0'}"/>

    <f:if condition="{page._translations}">
        <f:for each="{page._translations}" as="page">
            <f:render section="entry" arguments="{page:page,indent:'ps-3'}"/>
        </f:for>
    </f:if>

</f:for>

<f:section name="entry">
    <div id="record-{page.uid}" data-locked="{page.tx_slug_locked}" data-record="{page.uid}" data-siteprefix="{page.base}{page.base_language}" data-table="pages" class="slug-record border-bottom py-3">
        <div class="form-row align-items-center">
            <div class="flex-grow-1 {indent}">
                <f:render section="title" arguments="{doktype:page.doktype, title:page.title, root:page.is_siteroot, uid:page.uid, hidden:page.hidden, locked:page.tx_slug_locked, full_url:page.full_url}"/>
            </div>
            <div class="flex-grow-1">
                <div class="input-group">
                    <span class="input-group-text"><core:icon identifier="flags-{page.flag}" size="small" title="{page.flag}"/></span>
                    <input type="text" class="form-control slug-input" id="slug-input-field-{page.uid}" value="{page.slug}"/>
                </div>
            </div>
            <div class="btn-group">
                <f:if condition="{page.tx_slug_locked} === 0">
                <a class="btn btn-default btn-save"><core:icon identifier="actions-save" size="small" /></a>
                <a class="btn btn-default btn-generate"><core:icon identifier="actions-refresh" size="small" /></a>
                </f:if>
                <button class="btn btn-default dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false"></button>
                <ul class="dropdown-menu">
                    <li><f:be.link route="slug_page" parameters="{id:page.uid}" class="dropdown-item"><core:icon identifier="actions-open" size="small" /> {f:translate(key:'button.edit.open_in_slug_page_module', extensionName: 'slug')}</f:be.link></li>
                    <li><be:link.editRecord uid="{page.uid}" table="pages" returnUrl="{f:be.uri(route: 'slug_list')}" class="dropdown-item"><core:icon identifier="actions-edit" size="small" /> {f:translate(key:'button.edit.page_properties', extensionName: 'slug')}</be:link.editRecord></li>
                    <li><a href="#" class="dropdown-item btn-info"><core:icon identifier="actions-info-circle" size="small" /> Info (experimental)</a></li>
                </ul>
            </div>
        </div>
        <div class="info-container"></div>
    </div>
</f:section>

<f:section name="title">
    <f:if condition="{hidden} === 1">
        <f:variable name="overlay" value="overlay-hidden"/>
    </f:if>
    <f:if condition="{root} == 1">
        <f:then>
            <div class="d-flex align-items-start gap-2 mb-1">
                <core:icon identifier="apps-pagetree-folder-root" overlay="{overlay}" size="small" title="uid={uid}"/>
                <f:render section="titlefield" arguments="{title:title,uid:uid,locked:locked}"/>
            </div>
        </f:then>
        <f:else>
            <f:switch expression="{doktype}">
                <f:case value="254">
                    <div class="d-flex align-items-start gap-2 mb-1">
                        <core:icon identifier="apps-pagetree-folder-default" overlay="{overlay}" size="small" title="uid={uid}"/>
                        <f:render section="titlefield" arguments="{title:title,uid:uid,locked:locked}"/>
                    </div>
                    <div class="slug-preview text-muted text-break">{full_url}</div>
                </f:case>
                <f:case value="6">
                    <div class="d-flex align-items-start gap-2 mb-1">
                        <core:icon identifier="apps-pagetree-page-backend-users" overlay="{overlay}" size="small" title="uid={uid}"/>
                        <f:render section="titlefield" arguments="{title:title,uid:uid,locked:locked}"/>
                    </div>
                    <a href="{full_url}" target="_blank" class="slug-preview text-break">{full_url}</a>
                </f:case>
                <f:case value="3">
                    <div class="d-flex align-items-start gap-2 mb-1">
                        <core:icon identifier="apps-pagetree-page-shortcut-external" overlay="{overlay}" size="small" title="uid={uid}"/>
                        <f:render section="titlefield" arguments="{title:title,uid:uid,locked:locked}"/>
                    </div>
                    <a href="{full_url}" target="_blank" class="slug-preview text-break">{full_url}</a>
                </f:case>
                <f:case value="4">
                    <div class="d-flex align-items-start gap-2 mb-1">
                        <core:icon identifier="apps-pagetree-page-shortcut" overlay="{overlay}" size="small" title="uid={uid}"/>
                        <f:render section="titlefield" arguments="{title:title,uid:uid,locked:locked}"/>
                    </div>
                    <a href="{full_url}" target="_blank" class="slug-preview text-break">{full_url}</a>
                </f:case>
                <f:defaultCase>
                    <div class="d-flex align-items-start gap-2 mb-1">
                        <core:icon identifier="apps-pagetree-page-default" overlay="{overlay}" size="small" title="uid={uid}"/>
                        <f:render section="titlefield" arguments="{title:title,uid:uid,locked:locked}"/>
                    </div>
                    <a href="{full_url}" target="_blank" class="slug-preview text-break">{full_url}</a>
                </f:defaultCase>
            </f:switch>
        </f:else>
    </f:if>
</f:section>

<f:section name="titlefield">
    <span class="page-title fw-semibold text-break locked-{locked}" contenteditable="false" data-pageuid="{uid}" title="double click to edit">{title}</span>
</f:section>
