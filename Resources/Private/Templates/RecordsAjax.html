{namespace be=TYPO3\CMS\Backend\ViewHelpers}

<f:for each="{records}" as="record">
    <f:render section="entry" arguments="{record:record,indent:'ps-0'}"/>

    <f:if condition="{record._translations}">
        <f:for each="{record._translations}" as="record">
            <f:render section="entry" arguments="{record:record,indent:'ps-3'}"/>
        </f:for>
    </f:if>

</f:for>

<f:section name="entry">
    <div id="record-{record.uid}" data-locked="0" data-record="{record.uid}" data-siteprefix="0" data-table="{record.table}" data-slug-field="{record.slugField}" class="slug-record border-bottom py-3">
        <div class="form-row align-items-center">
            <div class="flex-grow-1 {indent}">
                <f:render section="title" arguments="{title:record.title, uid:record.uid, hidden:record.hidden, table:record.table}"/>
            </div>
            <div class="flex-grow-1">
                <div class="input-group">
                    <span class="input-group-text"><f:format.raw>{record.icon}</f:format.raw></span>
                    <input type="text" class="form-control slug-input" id="slug-input-field-{record.uid}" value="{record.slug}"/>
                </div>
            </div>
            <div class="btn-group">
                <a class="btn btn-default btn-save"><core:icon identifier="actions-save" size="small" /></a>
                <a class="btn btn-default btn-generate"><core:icon identifier="actions-refresh" size="small" /></a>
                <be:link.editRecord uid="{record.uid}" table="{record.table}" returnUrl="{f:be.uri(route: 'slug_list')}" class="btn btn-default btn-edit" title="{f:translate(key:'button.edit.page_properties', extensionName: 'slug')}"><core:icon identifier="actions-open" size="small" /></be:link.editRecord>
            </div>
        </div>
    </div>
</f:section>

<f:section name="title">
    <f:if condition="{hidden} === 1">
        <f:variable name="overlay" value="overlay-hidden"/>
    </f:if>
    <div class="d-flex align-items-start gap-2 mb-1">
        <core:iconForRecord table="{table}" row="{uid:uid}" />
        <span class="record-title fw-semibold text-break locked-{locked}" contenteditable="false" data-uid="{uid}" data-table="{table}" title="double click to edit">{title}</span>
    </div>
</f:section>
